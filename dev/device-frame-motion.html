<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Device frame: a moving phone</title>
    <!-- Turns <mnw-device-frame>'s phone every animation frame, as a scroll-driven page does, and
         reports the frame times. Run `npm run build`, serve the parent folder of this repository and
         open /material-next-web-components/dev/device-frame-motion.html. Query parameters: seconds,
         finish. -->
    <script type="importmap">
      {
        "imports": {
          "lit": "../node_modules/lit/index.js",
          "lit/": "../node_modules/lit/",
          "lit-html": "../node_modules/lit-html/lit-html.js",
          "lit-html/": "../node_modules/lit-html/",
          "lit-element/": "../node_modules/lit-element/",
          "@lit/reactive-element": "../node_modules/@lit/reactive-element/reactive-element.js",
          "@lit/reactive-element/": "../node_modules/@lit/reactive-element/",
          "three": "../node_modules/three/build/three.module.js",
          "three/examples/jsm/": "../node_modules/three/examples/jsm/"
        }
      }
    </script>
    <style>
      body { margin: 0; padding: 48px; background: #eef1f6; font: 14px system-ui, sans-serif; display: flex; gap: 48px; flex-wrap: wrap; align-items: center; }
      .screen { box-sizing: border-box; background: linear-gradient(#d7e3ff, #f6f8fd); padding: 64px 24px; font-size: 28px; color: #1b1b1f; }
      .screen p { font-size: 16px; }
    </style>
  </head>
  <body>
    <pre id="stats">running…</pre>
    <script type="module">
      import '../dist/marketing/ui/device-frame.js';
      const params = new URLSearchParams(location.search);
      const seconds = Number(params.get('seconds') ?? 4);
      const frame = document.createElement('mnw-device-frame');
      frame.finish = params.get('finish') ?? 'obsidian';
      frame.innerHTML = '<div class="screen">Hello<p>A live screen, turning with the phone.</p></div>';
      document.body.append(frame);
      await frame.updateComplete;
      const times = [];
      let last = performance.now();
      const start = last;
      await new Promise((done) => {
        const step = (now) => {
          times.push(now - last);
          last = now;
          const t = (now - start) / 1000;
          // A turn in, as a presentation drives it from scroll progress.
          frame.yaw = -40 * Math.cos(t * 1.4) + 10;
          frame.pitch = 6 * Math.sin(t * 0.9);
          if (t < seconds) requestAnimationFrame(step);
          else done();
        };
        requestAnimationFrame(step);
      });
      document.body.dataset.moving = 'shot';
      await new Promise((r) => setTimeout(r, 50));
      const sorted = times.slice(5).sort((a, b) => a - b);
      const at = (q) => sorted[Math.floor(q * (sorted.length - 1))].toFixed(1);
      await frame.updateComplete;
      await new Promise((r) => setTimeout(r, 600));
      await frame.updateComplete;
      document.getElementById('stats').textContent = `frames ${sorted.length}, median ${at(0.5)} ms, p95 ${at(0.95)} ms`;
      document.title = 'done';
    </script>
  </body>
</html>
