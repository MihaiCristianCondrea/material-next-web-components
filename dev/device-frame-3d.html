<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Device frame: 3D phone</title>
    <!-- Review page for <mnw-device-frame>'s phone. Run `npm run build`, serve the parent folder of
         this repository and open /material-next-web-components/dev/device-frame-3d.html. Query
         parameters: finish, yaw, pitch, logo (a white-on-transparent image URL), scale. -->
    <script type="importmap">
      {
        "imports": {
          "lit": "../node_modules/lit/index.js",
          "lit/": "../node_modules/lit/",
          "lit-html": "../node_modules/lit-html/lit-html.js",
          "lit-html/": "../node_modules/lit-html/",
          "lit-element/": "../node_modules/lit-element/",
          "@lit/reactive-element": "../node_modules/@lit/reactive-element/reactive-element.js",
          "@lit/reactive-element/": "../node_modules/@lit/reactive-element/",
          "three": "../node_modules/three/build/three.module.js",
          "three/examples/jsm/": "../node_modules/three/examples/jsm/"
        }
      }
    </script>
    <style>
      body { margin: 0; padding: 48px; background: #eef1f6; font: 14px system-ui, sans-serif; display: flex; gap: 48px; flex-wrap: wrap; align-items: center; }
      .screen { box-sizing: border-box; background: linear-gradient(#d7e3ff, #f6f8fd); padding: 64px 24px; font-size: 28px; color: #1b1b1f; }
      .screen p { font-size: 16px; }
    </style>
  </head>
  <body>
    <script type="module">
      import '../dist/marketing/ui/device-frame.js';
      const params = new URLSearchParams(location.search);
      const poses = (params.get('poses') ?? '0,0').split(';').map((p) => p.split(',').map(Number));
      for (const [yaw, pitch] of poses) {
        const frame = document.createElement('mnw-device-frame');
        frame.finish = params.get('finish') ?? 'obsidian';
        frame.yaw = yaw;
        frame.pitch = pitch;
        if (params.get('logo')) frame.logo = params.get('logo');
        frame.style.zoom = params.get('scale') ?? '1';
        frame.innerHTML = '<div class="screen">Hello<p>A live screen: this text is DOM, laid over the display.</p></div>';
        document.body.append(frame);
      }
      for (const frame of document.querySelectorAll('mnw-device-frame')) await frame.updateComplete;
      document.title = 'done';
    </script>
  </body>
</html>
