name: Publish to npm

# Publishing a GitHub release publishes the package. The release tag must
# match package.json: v0.2.0 for "version": "0.2.0". A release marked as a
# pre-release goes to the "next" dist-tag, so `npm install` keeps the stable one.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build and pack without publishing
        type: boolean
        default: true

permissions:
  contents: read
  # npm provenance: links the published package to this workflow run.
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, test and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Check the tag matches package.json
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::Release tag $TAG does not match package.json version $version"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Test
        run: npm run test:dev
        env:
          BROWSERS: chromium

      - name: Check package exports
        run: node scripts/smoke-exports.mjs

      - name: Pack
        run: npm pack --dry-run

      - name: Publish
        if: github.event_name == 'release' || inputs.dry-run == false
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_KEY }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            npm publish --provenance --access public --tag next
          else
            npm publish --provenance --access public
          fi
